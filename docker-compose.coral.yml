version: '3'

services:
  coral-training:
    build:
      context: .
      dockerfile: Dockerfile.coral
    volumes:
      - ./:/app  # Mount current directory to /app
      - /tmp/.X11-unix:/tmp/.X11-unix  # For GUI display
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all  # Make all GPUs visible
    devices:
      - /dev/video0:/dev/video0  # Camera device for testing
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    network_mode: host  # Simplifies X11 forwarding
    # To train:
    # command: python train_coral.py --dataset_dir /app/dataset --annotations_file /app/dataset/annotations.json
    # To test on camera:
    # command: python test_coral.py --use_camera
    # To test on an image:
    # command: python test_coral.py --image_path /app/dataset/test_image.jpg 