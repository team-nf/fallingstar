version: '3'

services:
  vision-pc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-processing-pc
    restart: unless-stopped
    privileged: true  # Needed for camera access
    volumes:
      - ./:/app  # Mount the entire project directory
      - /tmp/.X11-unix:/tmp/.X11-unix  # For GUI display if needed
      - node_modules:/app/ui/node_modules  # For node_modules volume
    devices:
      - /dev/video0:/dev/video0  # Camera device (adjust as needed)
    environment:
      - DISPLAY=${DISPLAY}  # For GUI display
      - CONFIG_PATH=config/pc_config.json
      - ENABLE_UI=true
      - TEAM_NUMBER=9029
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Enable hot reload in Docker
      - WDS_SOCKET_PORT=0  # Fix for React hot reload in Docker
      - HOST=0.0.0.0  # Listen on all interfaces
    ports:
      - "9029:9029"  # Backend port
      - "3000:3000"  # React dev server port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9029/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "cd /app/ui && 
             npm install && 
             (npm run client & cd /app && python ui/server.py --config config/pc_config.json --port 9029)"
    networks:
      - vision-network

volumes:
  node_modules:

networks:
  vision-network:
    driver: bridge 