<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallingStar Vision - Yönlendiriliyor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 20px;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        .loader {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #00ff00;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .link {
            color: #00ff00;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #00ff00;
            margin-top: 20px;
            display: inline-block;
            border-radius: 4px;
        }
        .link:hover {
            background-color: rgba(0, 255, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FallingStar Vision</h1>
        <p>React uygulaması yapım aşamasında. Lütfen biraz bekleyin ya da aşağıdaki bağlantıya tıklayın.</p>
        <div class="loader"></div>
        <p>3 saniye içinde React uygulamasına yönlendirileceksiniz.</p>
        <a href="http://localhost:3000" class="link">React Uygulamasına Git</a>
    </div>

    <script>
        // Sayfa yüklendiğinde React uygulamasına yönlendir
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                window.location.href = 'http://localhost:3000';
            }, 3000);
        });
    </script>
</body>
</html>
