services:
  coral:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true  # Required for USB device access
    volumes:
      - /dev/bus/usb:/dev/bus/usb  # Mount USB devices
      - .:/app  # Mount current directory as working directory
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket for display
    devices:
      - "/dev/video0:/dev/video0"  # Access to webcam
    environment:
      - DISPLAY  # For GUI applications
    # Keep the container running for development
    stdin_open: true
    tty: true 